[project]
name = "ssa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.34.0",
    "backoff>=2.2.1",
    "datasets>=3.6.0",
    "diskcache>=5.6.3",
    "dspy>=3.0.3",
    "flash-attn>=2.8.3",
    "gdown>=5.2.0",
    "google-genai>=1.36.0",
    "hydra-core>=1.3.2",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "jiwer>=4.0.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.3",
    "moviepy>=2.1.1",
    "numpy>=2.2.6",
    "openai>=1.107.3",
    "peft>=0.17.1",
    "pillow>=11.2.1",
    "polars>=1.28.0",
    "pyarrow>=18.1.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "rich>=14.0.0",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "sounddevice>=0.5.2",
    "soundfile>=0.12.1",
    "torchaudio>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.66.0",
    "transformers==4.49.0",
]


[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Force flash-attn to build from source to match installed PyTorch version
no-binary-package = ["flash-attn"]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend-select = ["I"]
